<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria com efeito fumê</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <div class="galeria">
      <!-- Os botões permitem selecionar as imagens pelo teclado. -->
      <button type="button" aria-label="Ampliar imagem de água-viva">
        <img src="Imagens/aguaviva.png" alt="Água-viva">
      </button>


      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="Imagens/coala.png" alt="Coala">
      </button>


      <button type="button" aria-label="Ampliar paisagem de deserto">
        <img src="Imagens/paisagemdeserto.png" alt="Paisagem de deserto">
      </button>


      <button type="button" aria-label="Ampliar flores em um lago">
        <img src="Imagens/floresemlago.png" alt="Flores em um lago">
      </button>


      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="Imagens/casaproxlago.png" alt="Casas próximas ao lago">
      </button>


      <button type="button" aria-label="Ampliar rio com árvores">
        <img src="Imagens/riocomarvore.png" alt="Rio com árvores">
        <button type="button" aria-label="Ampliar porco palmeirense">
            <img src="Imagens/porcopalmeiras.jpeg" alt="Porco Palmeirense">
        </button>
        

        <button type="button" aria-label="Ampliar Piquerez Lindo">
            <img src="Imagens/piquerezlindoperfeitovaipalmeiras.jpg" alt="Piquerez Lindo">
        </button>

      </button>
    </div>
  </main>


  <!-- Janela que apresenta a imagem ampliada. -->
  <dialog class="ampliacao" aria-label="Imagem ampliada">
    <button class="fechar" type="button"
      aria-label="Fechar imagem ampliada">
      &times;
    </button>


    <img class="imagem-ampliada" alt="">
  </dialog>
 
  <script src="script.js"></script>
</body>
</html>
